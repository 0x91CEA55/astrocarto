<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>astrocarto — what birth time decides</title>
<style>
:root{
  --Sun:#F0C244;--Moon:#8FC7E8;--Mercury:#B07FD4;--Venus:#E8628F;--Mars:#D9553D;
  --Jupiter:#C87A2E;--Saturn:#7C8AA6;--Uranus:#4FB8A8;--Neptune:#4A7FD4;--Pluto:#9A6BB0;
  --bg:#020308;--hi:#F6F2FF;--mid:#B9B3D4;--lo:#8F87B4;--faint:#6F678F;
  --voice:Optima,Candara,"Palatino Linotype",Palatino,serif;
  --data:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--mid)}
body{font-family:var(--voice)}
#globebox{position:fixed;inset:0;display:grid;place-items:center;z-index:0}
#scrim{position:fixed;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(180deg,var(--bg) 0%,rgba(2,3,8,.90) 13%,rgba(2,3,8,0) 30%,
    rgba(2,3,8,0) 62%,rgba(2,3,8,.90) 84%,var(--bg) 100%)}
#vign{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(58% 52% at 50% 50%,rgba(2,3,8,0) 40%,rgba(2,3,8,.55) 100%)}
svg.globe{width:min(108vh,108vw);height:auto;touch-action:none;cursor:grab}
svg.globe:active{cursor:grabbing}
.sea{fill:#04050C}
.land{fill:rgba(120,110,180,.07);stroke:rgba(150,140,215,.15);stroke-width:.45}
.grat{stroke:rgba(140,130,200,.055);fill:none}
.limb{stroke:rgba(170,155,235,.16);fill:none}
.ln{fill:none;stroke-linecap:round;stroke-width:1.7;filter:url(#bloom)}
.ln.flat{filter:none}

.shade{text-shadow:0 2px 40px var(--bg),0 2px 14px var(--bg),0 0 6px var(--bg)}

/* identity readout — the hero */
#idcard{position:fixed;z-index:8;top:6vh;left:50%;transform:translateX(-50%);
  text-align:center;pointer-events:none;width:min(92vw,760px)}
#idcard .row{display:flex;justify-content:center;gap:clamp(18px,5vw,58px)}
#idcard .cell{min-width:118px}
#idcard .k{font:var(--data);font-size:10.5px;letter-spacing:.14em;color:var(--faint);margin-bottom:5px}
#idcard .v{font:300 clamp(21px,3.3vw,34px)/1.1 var(--voice);color:var(--hi);transition:color .25s}
#idcard .d{font-family:var(--data);font-size:11px;color:var(--lo);margin-top:4px}
#idcard .v.warn{color:#F0C244}

/* the flip alarm */
#flip{position:fixed;z-index:6;top:calc(6vh + 132px);left:50%;transform:translateX(-50%);
  font-family:var(--data);font-size:11.5px;letter-spacing:.05em;color:#F0C244;
  opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;width:min(92vw,700px)}
#flip.on{opacity:1}

/* house table */
#houses{position:fixed;z-index:8;right:26px;top:50%;transform:translateY(-50%);
  font-family:var(--data);font-size:11.5px;line-height:1.95;width:206px}
#houses .hd{display:flex;gap:6px;margin-bottom:9px}
#houses .hd button{flex:1;cursor:pointer;border:1px solid #262038;background:none;color:var(--faint);
  font:inherit;font-size:10.5px;padding:5px 0;transition:all .18s}
#houses .hd button[aria-pressed="true"]{color:var(--hi);border-color:#4a3f6e;background:rgba(120,100,190,.16)}
#houses .r{display:flex;justify-content:space-between;color:var(--lo)}
#houses .r b{font-weight:400;color:var(--mid)}
#houses .r.moved b,#houses .r.moved span{color:#F0C244}
#houses .note{margin-top:11px;color:var(--faint);font-size:10px;line-height:1.6}

/* scrubber */
#dock{position:fixed;z-index:7;left:50%;bottom:30px;transform:translateX(-50%);
  width:min(92vw,660px);text-align:center}
#clock{font-family:var(--data);font-size:clamp(22px,3.4vw,30px);color:var(--hi);letter-spacing:.03em}
#delta{font-family:var(--data);font-size:11.5px;color:var(--faint);margin-top:3px}
#scrub{width:100%;margin-top:14px;-webkit-appearance:none;appearance:none;background:none;height:26px;cursor:ew-resize}
#scrub::-webkit-slider-runnable-track{height:1px;background:linear-gradient(90deg,#2A2340,#6E5FA8,#2A2340)}
#scrub::-moz-range-track{height:1px;background:#3A3158}
#scrub::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;
  background:var(--hi);margin-top:-6px;box-shadow:0 0 16px rgba(200,180,255,.75)}
#scrub::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:var(--hi)}
#hintline{font-family:var(--data);font-size:10.5px;color:var(--faint);margin-top:9px;letter-spacing:.04em}
#reset{margin-top:8px;background:none;border:0;color:var(--lo);font:11.5px/1 var(--data);
  cursor:pointer;text-decoration:underline;text-underline-offset:3px}
button:focus-visible,#scrub:focus-visible{outline:2px solid var(--hi);outline-offset:3px}
@media (max-width:820px){
  #houses{position:static;transform:none;width:auto;margin:0 auto;padding:0 20px}
  #idcard{top:3vh}
}
</style>
</head>
<body>

<div id="vign"></div>
<div id="globebox"><svg class="globe" viewBox="0 0 620 620" aria-label="Globe of astrocartography lines"></svg></div>
<div id="scrim"></div>

<div id="idcard" class="shade">
  <div class="row">
    <div class="cell"><div class="k">SUN</div><div class="v" id="vSun">—</div><div class="d" id="dSun"></div></div>
    <div class="cell"><div class="k">MOON</div><div class="v" id="vMoon">—</div><div class="d" id="dMoon"></div></div>
    <div class="cell"><div class="k">RISING</div><div class="v" id="vAsc">—</div><div class="d" id="dAsc"></div></div>
  </div>
</div>

<div id="flip"></div>

<div id="houses" class="shade">
  <div class="hd">
    <button data-hs="W" aria-pressed="true">Whole-sign</button>
    <button data-hs="P" aria-pressed="false">Placidus</button>
  </div>
  <div id="hrows"></div>
  <div class="note" id="hnote"></div>
</div>

<div id="dock" class="shade">
  <div id="clock">22:45</div>
  <div id="delta">as recorded on the certificate</div>
  <input id="scrub" type="range" min="-90" max="90" value="0" step="1"
         aria-label="Adjust birth time in minutes">
  <div id="hintline">drag to change the birth time · everything below follows from it</div>
  <button id="reset">reset to 22:45</button>
</div>

  svg.appendChild(el("circle",{cx:CX,cy:CY,r:R,class:"sea"}));

  const g=el("g",{});
  for(let la=-60;la<=60;la+=30){const p=[];for(let lo=-180;lo<=180;lo+=4)p.push([la,lo]);
    g.appendChild(el("path",{d:pathOf(p,true),class:"grat"}))}
  for(let lo=-180;lo<180;lo+=30){const p=[];for(let la=-84;la<=84;la+=4)p.push([la,lo]);
    g.appendChild(el("path",{d:pathOf(p,true),class:"grat"}))}
  svg.appendChild(g);

  const gl=el("g",{});
  for(const poly of D.land){const d=pathOf(poly,false);if(d)gl.appendChild(el("path",{d,class:"land"}))}
  svg.appendChild(gl);

  // bloom is expensive per frame — drop it while scrubbing or dragging
  const flat = dragging || scrubbing;
  const gs=el("g",{});
  for(const b of BODIES){
    const [ra,dec]=f.b[b];
    for(const a of ANG){
      for(const seg of segments(ra,dec,a,f.g)){
        const d=pathOf(seg,false);if(!d)continue;
        const p=el("path",{d,class:"ln"+(flat?" flat":""),stroke:hue(b),opacity:.72});
        if(a==="MC"||a==="IC")p.setAttribute("stroke-dasharray","6 5");
        gs.appendChild(p);
      }
    }
  }
  svg.appendChild(gs);
  svg.appendChild(el("circle",{cx:CX,cy:CY,r:R,class:"limb"}));
}

function houseOfPlacidus(l,c){
  for(let i=0;i<12;i++){const a=c[i],b=c[(i+1)%12];
    if(((l-a)%360+360)%360 < ((b-a)%360+360)%360) return i+1}
  return 12;
}
const houseOfWhole=(l,asc)=>((Math.floor(l/30)-Math.floor(asc/30))%12+12)%12+1;

function render(){
  const f=F(), f0=D.f[90];
  const hh=22, mm=45+t, H=(hh+Math.floor((mm)/60)+24)%24, M=((mm%60)+60)%60;
  clock.textContent=`${String(H).padStart(2,"0")}:${String(M).padStart(2,"0")}`;
  delta.textContent = t===0 ? "as recorded on the certificate"
    : `${t>0?"+":"−"}${Math.abs(t)} minute${Math.abs(t)===1?"":"s"}`;

  const set=(k,v,d,changed)=>{
    const e=document.getElementById("v"+k); e.textContent=v;
    e.classList.toggle("warn",changed); document.getElementById("d"+k).textContent=d};
  set("Sun",sign(f.b.Sun[2]),deg(f.b.Sun[2]),sign(f.b.Sun[2])!==sign(f0.b.Sun[2]));
  set("Moon",sign(f.b.Moon[2]),deg(f.b.Moon[2]),sign(f.b.Moon[2])!==sign(f0.b.Moon[2]));
  set("Asc",sign(f.a),deg(f.a),sign(f.a)!==sign(f0.a));

  // distance to the nearest rising-sign boundary, in minutes
  let flipAt=null;
  for(let k=1;k<=90;k++){
    const lo=D.f[90+t-k], hi=D.f[90+t+k];
    if(hi&&sign(hi.a)!==sign(f.a)){flipAt=k;break}
    if(lo&&sign(lo.a)!==sign(f.a)){flipAt=-k;break}
  }
  const fl=document.getElementById("flip");
  if(flipAt!==null&&Math.abs(flipAt)<=6){
    const other=sign(D.f[90+t+flipAt].a);
    fl.textContent=`${Math.abs(flipAt)} minute${Math.abs(flipAt)===1?"":"s"} ${flipAt<0?"earlier":"later"} and the rising sign is ${other}`;
    fl.classList.add("on");
  } else fl.classList.remove("on");

  const rows=BODIES.map(b=>{
    const l=f.b[b][2];
    const now = hs==="W" ? houseOfWhole(l,f.a) : houseOfPlacidus(l,f.c);
    const alt = hs==="W" ? houseOfPlacidus(l,f.c) : houseOfWhole(l,f.a);
    return `<div class="r${now!==alt?" moved":""}"><span>${b}</span><b>${now}</b></div>`;
  }).join("");
  hrows.innerHTML=rows;
  const n=BODIES.filter(b=>houseOfWhole(f.b[b][2],f.a)!==houseOfPlacidus(f.b[b][2],f.c)).length;
  hnote.textContent = n===0
    ? "Both systems agree on every placement right now."
    : `${n} of 10 planets sit in a different house under the other system. Highlighted above.`;
}

let scrubbing=false;
const scrub=document.getElementById("scrub");
scrub.addEventListener("pointerdown",()=>scrubbing=true);
addEventListener("pointerup",()=>{if(scrubbing){scrubbing=false;drawGlobe()}});
scrub.addEventListener("input",()=>{t=+scrub.value;render();drawGlobe()});
document.getElementById("reset").onclick=()=>{scrub.value=0;t=0;render();drawGlobe()};
document.querySelectorAll("[data-hs]").forEach(b=>b.onclick=()=>{
  hs=b.dataset.hs;
  document.querySelectorAll("[data-hs]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.hs===hs));
  render();
});

let dg=null;
svg.addEventListener("pointerdown",e=>{dg={x:e.clientX,y:e.clientY,l:rotL,p:rotP};dragging=true;svg.setPointerCapture(e.pointerId)});
svg.addEventListener("pointermove",e=>{if(!dg)return;
  rotL=dg.l+(e.clientX-dg.x)*.35;rotP=Math.max(-78,Math.min(78,dg.p+(e.clientY-dg.y)*.35));drawGlobe()});
svg.addEventListener("pointerup",()=>{dg=null;dragging=false;drawGlobe()});
svg.addEventListener("pointercancel",()=>{dg=null;dragging=false});

render();drawGlobe();
</script>
</body>
</html>
